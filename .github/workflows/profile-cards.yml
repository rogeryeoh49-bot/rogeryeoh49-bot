name: Refresh profile cards

on:
  push:
    paths:
      - .github/workflows/profile-cards.yml
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Generate self-hosted profile statistics
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: rogeryeoh49-bot
          cards: overview,languages
          output-dir: assets/profile
          themes: light,dark
          palette: blue
          language-limit: 6
          commit: false

      - name: Publish generated profile cards
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/profile/overview.dark.svg
          test -s assets/profile/overview.light.svg
          test -s assets/profile/languages.dark.svg
          test -s assets/profile/languages.light.svg
          git add assets/profile/*.svg
          if git diff --cached --quiet; then
            echo "No stats changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh self-hosted profile stats [skip ci]"
          git push
