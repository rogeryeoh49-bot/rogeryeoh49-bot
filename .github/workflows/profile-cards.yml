name: Refresh profile cards

on:
  push:
    paths:
      - .github/workflows/profile-cards.yml
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate self-hosted profile statistics
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: rogeryeoh49-bot
          cards: overview,languages
          output-dir: assets/profile
          themes: light,dark
          palette: blue
          language-limit: 6
          commit: false

      - name: Publish cards and activate them in the README
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/profile/overview.dark.svg
          test -s assets/profile/overview.light.svg
          test -s assets/profile/languages.dark.svg
          test -s assets/profile/languages.light.svg
          python3 - <<'PY'
          from pathlib import Path
          p = Path("README.md")
          text = p.read_text()
          start = text.index("<!-- PROFILE_STATS_START -->")
          end = text.index("<!-- PROFILE_STATS_END -->", start) + len("<!-- PROFILE_STATS_END -->")
          replacement = """<!-- PROFILE_STATS_START -->
          <div align="center">
            <picture>
              <source media="(prefers-color-scheme: dark)" srcset="./assets/profile/overview.dark.svg" />
              <img alt="Roger's GitHub contributions, repositories, stars, and pull requests" src="./assets/profile/overview.light.svg" width="100%" />
            </picture>
            <picture>
              <source media="(prefers-color-scheme: dark)" srcset="./assets/profile/languages.dark.svg" />
              <img alt="Programming languages across Roger's public source repositories" src="./assets/profile/languages.light.svg" width="100%" />
            </picture>
          </div>

          <sub>Generated daily from GitHub data. Language breakdown reflects repository code, not proficiency. These cards are hosted in this repository.</sub>
          <!-- PROFILE_STATS_END -->"""
          p.write_text(text[:start] + replacement + text[end:])
          PY
          git add README.md assets/profile/*.svg
          if git diff --cached --quiet; then
            echo "No stats changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh self-hosted profile stats [skip ci]"
          git push
